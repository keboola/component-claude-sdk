[project]
name = "app-claude-sdk"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "claude-agent-sdk==0.2.101",
    "keboola-component>=1.10.0",
    "keboola-http-client>=1.0.1",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.ty.rules]
# ty 0.0.49 tightened LSP checks on test helpers that intentionally override
# stdlib methods with compatible (but not identical) signatures.  Suppress the
# patterns that are false-positive noise in tests and scripts.
unsupported-operator = "warn"
invalid-method-override = "warn"
# invalid-key fires on TypedDict literals that use a superset of the declared
# keys — common in test fixtures that pass extra config to loosen validation.
invalid-key = "warn"
not-subscriptable = "warn"
# invalid-argument-type fires on FakeComponent/FakeHttpClient test helpers that
# are structurally compatible but not nominally subtypes of the expected class.
# These are intentional test patterns, not real type errors.
invalid-argument-type = "warn"
# unresolved-attribute fires on union-typed config objects accessed by field name
# (McpStdioServer | McpRemoteServer) where only one branch has the attribute.
# Tests access these via correct isinstance checks; the error is a ty limitation.
unresolved-attribute = "warn"
